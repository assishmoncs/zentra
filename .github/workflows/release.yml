name: Android Release Build

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build Signed Release Bundle & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode Release Keystore (if secret provided)
        if: env.ZENTRA_KEYSTORE_BASE64 != ''
        env:
          ZENTRA_KEYSTORE_BASE64: ${{ secrets.ZENTRA_KEYSTORE_BASE64 }}
        run: |
          echo "$ZENTRA_KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Run Unit Tests & Release Lint
        run: ./gradlew testDebugUnitTest lintRelease

      - name: Build Release AAB & APK
        env:
          ZENTRA_KEYSTORE_PATH: ${{ secrets.ZENTRA_KEYSTORE_BASE64 != '' && 'release.keystore' || '' }}
          ZENTRA_KEYSTORE_PASSWORD: ${{ secrets.ZENTRA_KEYSTORE_PASSWORD }}
          ZENTRA_KEY_ALIAS: ${{ secrets.ZENTRA_KEY_ALIAS }}
          ZENTRA_KEY_PASSWORD: ${{ secrets.ZENTRA_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease

      - name: Upload Release Artifacts & R8 Mapping
        uses: actions/upload-artifact@v4
        with:
          name: zentra-release-${{ github.ref_name }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
